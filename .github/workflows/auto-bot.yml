name: Auto Blogger Bot

# Botun ne zaman çalışacağını belirliyoruz
on:
  schedule:
    # Her gün sabah saat 08:00'de çalışır (UTC saatine göre 05:00)
    - cron: '0 5 * * *'
  # İstenildiğinde GitHub üzerinden manuel tetiklemeye de izin ver
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # GitHub'ın dosyaları commit etmesine (kaydetmesine) izin veriyoruz
    permissions:
      contents: write

    steps:
      # 1. Kodları Çek (v4 sürümü)
      - name: Kodları Çek
        uses: actions/checkout@v4

      # 2. Node.js Kur (v4 sürümü)
      - name: Node.js Kur
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Güncel sürüm kullanılıyor

      - name: Kütüphaneleri Yükle
        run: npm install

      - name: Yapay Zeka Botunu Çalıştır
        env:
          # GitHub Secrets üzerinden güvenli şifreleri alıyoruz
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node auto-blogger.js

      - name: Üretilen Yeni İçerikleri (posts.json) Siteye Kaydet ve Güncelle
        run: |
          git config --global user.name "Auto Blogger Bot"
          git config --global user.email "bot@autoblogger.com"
          git add posts.json sitemap.xml
          git commit -m "🤖 Otomatik İçerik Güncellemesi" || echo "Değişiklik yok."
          git push
